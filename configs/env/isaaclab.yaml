##################################################################################
# Isaac Lab
##################################################################################

env_type: 'isaaclab'
env_name: 'Isaac-Velocity-Flat-G1-v0'
num_env_steps: ${num_env_steps}

seed: ${seed}
num_train_envs: ${num_train_envs}
num_eval_envs: ${num_eval_envs}
num_record_envs: ${num_record_envs}
rescale_action: null
max_episode_steps: null
# Privileged critic: also return a noise-free copy of the policy observations for the critic.
# Requires agent.asymmetric_observation=true, so that the actor keeps reading only the noisy observations.
privileged_critic: false
